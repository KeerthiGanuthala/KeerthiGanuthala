<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="840" height="160" role="img" aria-label="Laxmi Keerthi Reddy Ganuthala - AI/ML Engineer">
  <style>
    .bg { fill: #0d1117; }
    .grid { stroke: #1b2330; stroke-width: 1; }
    .title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 22px; font-weight: 700; fill: #f0f6fc; letter-spacing: 0.3px; }
    .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #8b949e; }
    .pill { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .pill-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #58a6ff; }
    .trace-line { fill: none; stroke: #238636; stroke-width: 2; stroke-linecap: round; }
    .node { fill: #0d1117; stroke: #3fb950; stroke-width: 2; }
    .pulse { fill: #3fb950; }
    @media (prefers-reduced-motion: reduce) {
      .anim { display: none; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="840" height="160" rx="8"/>

  <g class="grid" opacity="0.6">
    <line x1="0" y1="40" x2="840" y2="40"/>
    <line x1="0" y1="80" x2="840" y2="80"/>
    <line x1="0" y1="120" x2="840" y2="120"/>
    <line x1="168" y1="0" x2="168" y2="160"/>
    <line x1="336" y1="0" x2="336" y2="160"/>
    <line x1="504" y1="0" x2="504" y2="160"/>
    <line x1="672" y1="0" x2="672" y2="160"/>
  </g>

  <g transform="translate(555, 34)">
    <path class="trace-line" d="M 10,32 L 70,32 L 110,12 L 175,12 L 215,32 L 255,32"/>
    <path stroke="#30363d" stroke-width="1.5" fill="none" stroke-dasharray="4,4" d="M 70,32 L 110,52 L 175,52 L 215,32"/>
    <circle class="node" cx="10" cy="32" r="4.5"/>
    <circle class="node" cx="70" cy="32" r="4.5"/>
    <circle class="node" cx="110" cy="12" r="4.5"/>
    <circle class="node" cx="175" cy="12" r="4.5"/>
    <circle class="node" cx="215" cy="32" r="4.5"/>
    <circle class="node" cx="255" cy="32" r="4.5"/>
    <circle class="pulse anim" r="3.5">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M 10,32 L 70,32 L 110,12 L 175,12 L 215,32 L 255,32"/>
    </circle>
  </g>

  <text class="title" x="34" y="56">Laxmi Keerthi Reddy Ganuthala</text>
  <text class="sub" x="34" y="82">AI/ML Engineer · LLMs, RAG, LangGraph &amp; MLOps</text>

  <g transform="translate(34, 106)">
    <rect class="pill" x="0" y="0" width="96" height="24" rx="4"/>
    <text class="pill-text" x="12" y="16">LangGraph</text>

    <rect class="pill" x="108" y="0" width="92" height="24" rx="4"/>
    <text class="pill-text" x="120" y="16">RAG / LLM</text>

    <rect class="pill" x="212" y="0" width="108" height="24" rx="4"/>
    <text class="pill-text" x="224" y="16">Azure &amp; AWS</text>

    <rect class="pill" x="332" y="0" width="112" height="24" rx="4"/>
    <text class="pill-text" x="344" y="16">FastAPI / AKS</text>
  </g>
</svg>
